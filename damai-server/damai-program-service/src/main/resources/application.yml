#服务端口
server:
  port: 6086
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
# 应用名称
spring:
  profiles:
    active: local
  application:
    name: ${prefix.distinction.name:damai}-program-service
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
    jackson:
      time-zone: GMT+8
      date-format: yyyy-MM-dd HH:mm:ss
      generator:
        WRITE_NUMBERS_AS_STRINGS: true
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-program-${spring.profiles.active}.yaml
  data:  
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 3000
      jedis:
        pool:
          max-active: 300  
      stream:
        streamName: invalid_program
        consumerType: broadcast
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
      eager: true
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      properties:
        max.block.ms: 1000
      retries: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    topic: create_order

bloom-filter:
  name: program-detail-bloom-filter
  expectedInsertions: 1000
  falseProbability: 0.01
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
feign:
  sentinel:
    enabled: false
  hystrix:
    enabled: true
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 512
    response:
      enabled: true
management:
  metrics:
    tags:
      application: program-service
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      # 打开 ES 健康检查：ES 挂了要让 /actuator/health 能看出来。
      # 注意：如果希望"搜索降级不影响其他接口"，K8s 的存活/就绪探针应该用 health group 指定 liveness/readiness，
      # 而不是直接拿整体 health 当存活判断，否则 ES 一挂实例就会被重启。
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
jasypt:
  encryptor:
    password: bgtjkjl!%^sdc
    algorithm: PBEWithMD5AndDES
elasticsearch:
  ip: 127.0.0.1:9200
  userName: elastic
  passWord: elastic
  # 默认 40 秒太长：ES 假死时会把 Tomcat 线程一直占住，最终拖垮整个服务。检索类调用 1~2 秒足够。
  connectTimeOut: 2000
  socketTimeOut: 2000
  connectionRequestTimeOut: 2000
# 搜索降级（Issue #11）：ES 挂了之后的兜底与保护
search:
  circuit-breaker:
    # 最近 20 次调用组成滑动窗口，窗口内失败率超过 50% 且调用数 ≥ 10 就跳闸
    window-size: 20
    min-calls: 10
    failure-rate-threshold: 0.5
    # 跳闸 10 秒后放 1 个探针试探，成功则恢复
    open-seconds: 10
    half-open-probes: 1
  fallback-rate-limit:
    # 兜底查库是 like 全表扫描，按令牌桶限流：每秒补 50 个，桶容量 100（允许短时突发）
    permits-per-second: 50
    bucket-capacity: 100
delay:
  queue:
    corePoolSize: 1
    maximumPoolSize: 1
    isolationRegionCount: 4
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      #生成文档所需的扫包路径，一般为启动类目录
      packages-to-scan: com.damai.controller
#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true